# Package-local `bun test src` runs measure layout lints the way the docs
# service does: text-measure's exact HarfBuzz backend, loaded by the shared
# docs-system preload. The action-log preload points the log at a temp file
# first, so no test writes ~/.codecaine/action-log.sqlite.
[test]
preload = ["../../action-log-preload.ts", "../../text-measure.ts"]
