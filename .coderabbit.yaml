# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review config. Pilot for the shared config copied to other reviewed repos.
language: en-US

reviews:
  profile: chill # balanced feedback; "assertive" adds nitpicks
  auto_approvals:
    enabled: false # current key for the deprecated request_changes_workflow: comment only, never approve or block
  high_level_summary: true
  poem: false
  review_status: true # say when a review is skipped, so babysit-pr can tell skipped from clean
  collapse_walkthrough: true
  sequence_diagrams: false
  auto_review:
    enabled: true
    drafts: false
  # Each reviewed file beyond the plan is billed, so skip files nobody writes by hand.
  path_filters:
    - "!**/dist/**"
    - "!**/dist-static/**"
    - "!**/build/**"
    - "!**/coverage/**"
    - "!bun.lock"
    - "!**/package-lock.json"
    - "!**/__snapshots__/**"
    - "!**/*.snap"
    - "!**/__fixtures__/**"
    - "!**/fixtures/**"
    - "!**/*.log"
    # BAML codegen output (edit baml_src/, then run baml-cli generate)
    - "!packages/docs-style/baml_client/**"
    # Docs pages (doc.json) and component sidecars (canvas, sequence, annotations, proposals) are written by the docs tools
    - "!docs/**/*.json"
    # Tool run reports and captured outputs
    - "!proposals/**/*.json"
    - "!objectives/**/artifacts/**/*.json"
    - "!objectives/**/artifacts/**/*.txt"
    - "!.agent-kernel/trace.db*"
  path_instructions:
    - path: "packages/**/*.{ts,tsx}"
      instructions: >-
        Flag correctness bugs, unsafe or loose types, unhandled errors, and changed
        behavior without a matching test. Skip style and formatting nits.
    - path: "**/*.test.{ts,tsx}"
      instructions: >-
        Flag tests that assert implementation details instead of behavior, or that
        cannot fail. Skip naming and formatting nits.

chat:
  auto_reply: true
